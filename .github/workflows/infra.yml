name: infra

on:
  pull_request:
    paths: ["terraform/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/infra.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_region: ${{ vars.AWS_REGION }}
  TF_VAR_github_repo: ${{ github.repository }}
  TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
  TF_VAR_mongo_admin_password: ${{ secrets.MONGO_ADMIN_PASSWORD }}
  TF_VAR_mongo_app_password: ${{ secrets.MONGO_APP_PASSWORD }}

jobs:
  iac-scan:
    name: IaC scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkov
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: terraform
          framework: terraform
          output_format: cli
          soft_fail: true # report but don't block: this environment is insecure on purpose

  plan:
    name: Terraform plan
    needs: iac-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets this job request the OIDC token
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=wiz-exercise/terraform.tfstate"
          -backend-config="region=${{ vars.AWS_REGION }}"
          -backend-config="use_lockfile=true"
          -backend-config="encrypt=true"
      - run: terraform fmt -check -recursive
      - run: terraform validate
      - run: terraform plan -input=false -lock-timeout=5m

  apply:
    name: Terraform apply
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production # waits for your approval
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=wiz-exercise/terraform.tfstate"
          -backend-config="region=${{ vars.AWS_REGION }}"
          -backend-config="use_lockfile=true"
          -backend-config="encrypt=true"
      - run: terraform apply -input=false -auto-approve -lock-timeout=5m